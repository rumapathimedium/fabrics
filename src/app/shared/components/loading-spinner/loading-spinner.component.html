<div [class]="getContainerClass()" [style]="getSpinnerStyle()">
  <!-- Circular Spinner -->
  <div *ngIf="type === 'circular'" 
       class="spinner circular-spinner" 
       [class]="getSizeClass()"
       aria-label="Loading">
    <div class="circle"></div>
  </div>

  <!-- Dots Spinner -->
  <div *ngIf="type === 'dots'" 
       class="spinner dots-spinner" 
       [class]="getSizeClass()"
       aria-label="Loading">
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
  </div>

  <!-- Pulse Spinner -->
  <div *ngIf="type === 'pulse'" 
       class="spinner pulse-spinner" 
       [class]="getSizeClass()"
       aria-label="Loading">
    <div class="pulse"></div>
  </div>

  <!-- Bars Spinner -->
  <div *ngIf="type === 'bars'" 
       class="spinner bars-spinner" 
       [class]="getSizeClass()"
       aria-label="Loading">
    <div class="bar bar1"></div>
    <div class="bar bar2"></div>
    <div class="bar bar3"></div>
    <div class="bar bar4"></div>
    <div class="bar bar5"></div>
  </div>

  <!-- Wave Spinner -->
  <div *ngIf="type === 'wave'" 
       class="spinner wave-spinner" 
       [class]="getSizeClass()"
       aria-label="Loading">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
    <div class="wave wave4"></div>
    <div class="wave wave5"></div>
  </div>

  <!-- Loading Message -->
  <div *ngIf="message" class="loading-message">
    {{ message }}
  </div>
</div>
