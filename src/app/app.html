<div class="app-container">
  <!-- Main Navigation -->
  <header class="main-header">
    <nav class="navbar">
      <div class="nav-brand">
        <a routerLink="/" class="brand-link">
          <i class="fas fa-store"></i>
          Cloth
        </a>
      </div>
      <div class="nav-links">
        <a routerLink="/" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{exact: true}"
           class="nav-link">Home</a>
        <a routerLink="/products" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{exact: false}"
           class="nav-link">Products</a>
        <a routerLink="/contact" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{exact: true}"
           class="nav-link">Contact</a>
        <a routerLink="/cart/cart" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{exact: true}"
           class="nav-link">
          <i class="fas fa-shopping-cart"></i>
          Cart
        </a>
        <a routerLink="/cart/wishlist" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{exact: true}"
           class="nav-link">
          <i class="fas fa-heart"></i>
          Wishlist
        </a>
        <div class="auth-links" *ngIf="!(authService.isAuthenticated$ | async); else userMenu">
          <a routerLink="/auth/login" 
             routerLinkActive="active" 
             [routerLinkActiveOptions]="{exact: true}"
             class="nav-link">Login</a>
          <a routerLink="/auth/registration" 
             routerLinkActive="active" 
             [routerLinkActiveOptions]="{exact: true}"
             class="nav-link btn-primary">Sign Up</a>
        </div>
        <ng-template #userMenu>
          <div class="user-menu">
            <a [routerLink]="(authService.currentUser$ | async)?.role === 'admin' ? '/admin' : '/user'" 
               routerLinkActive="active" 
               [routerLinkActiveOptions]="{exact: false}"
               class="nav-link">
              Dashboard
            </a>
            <button (click)="logout()" class="nav-link logout-btn">
              <i class="fas fa-sign-out-alt"></i>
              Logout
            </button>
          </div>
        </ng-template>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-content">
      <div class="footer-section">
        <h3>Cloth</h3>
        <p>Your premium fashion destination</p>
      </div>
      <div class="footer-section">
        <h4>Quick Links</h4>
        <ul>
          <li><a routerLink="/products">Products</a></li>
          <li><a routerLink="/contact">Contact</a></li>
          <li><a routerLink="/auth/login">Login</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h4>Customer Service</h4>
        <ul>
          <li><a href="#">Help Center</a></li>
          <li><a href="#">Shipping Info</a></li>
          <li><a href="#">Returns</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2024 Cloth. All rights reserved.</p>
    </div>
  </footer>
</div>
